[project]
name = "arnmatch"
dynamic = ["version"]
description = "Parse AWS ARNs into structured data (2000+ resource types)"
readme = "README.md"
authors = [
    { name = "Andrey Gubarev", email = "andrey@andreygubarev.com" }
]
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.scripts]
arnmatch = "arnmatch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/arnmatch/__init__.py"

[dependency-groups]
dev = [
    "boto3>=1.42.41",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/integration"]
