[project]
name = "arnmatch"
dynamic = ["version"]
description = "Auto-generated AWS ARN parser with mappings for 2100+ resources to CloudFormation, Tagging API, and boto3"
readme = "README.md"
authors = [
    { name = "Andrey Gubarev", email = "andrey@andreygubarev.com" }
]
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = [
    "amazon-resource-names",
    "arn",
    "aws",
    "aws-arn",
    "aws-inventory",
    "boto3",
    "cloudformation",
    "cloud-security",
    "cspm",
    "parser",
    "resource-tagging-api",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/andreygubarev/arnmatch"
Repository = "https://github.com/andreygubarev/arnmatch"
Issues = "https://github.com/andreygubarev/arnmatch/issues"
Changelog = "https://github.com/andreygubarev/arnmatch/releases"
PyPI = "https://pypi.org/project/arnmatch/"

[project.scripts]
arnmatch = "arnmatch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/arnmatch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/arnmatch"]

[tool.hatch.build.targets.sdist]
ignore-vcs = true
only-include = [
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "src/arnmatch",
]

[dependency-groups]
dev = [
    "boto3>=1.42.41",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/integration"]
